<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCAL Ecosystem - Geometría de Bures y Operador Phi</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 25, 0.85);
            --accent: #00f2fe;
            --accent-secondary: #4facfe;
            --text-color: #e0e0e8;
            --border-glow: rgba(0, 242, 254, 0.3);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .metric-value {
            font-family: monospace;
            color: var(--accent-secondary);
        }
        .control-group {
            margin-top: 15px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #b0b0c0;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .footer-info {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #808090;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
    </style>
    <!-- Importar Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>QCAL Ecosystem</h1>
        <div class="metric-row">
            <span>Frecuencia Base (f0):</span>
            <span class="metric-value" id="val-f0">141.70 Hz</span>
        </div>
        <div class="metric-row">
            <span>Coherencia (&Psi;):</span>
            <span class="metric-value" id="val-psi">0.999999</span>
        </div>
        <div class="metric-row">
            <span>Contracción (k):</span>
            <span class="metric-value">1.00e-6</span>
        </div>

        <div class="control-group">
            <label for="slider-f0">Modulación de Frecuencia (f0)</label>
            <input type="range" id="slider-f0" min="50" max="300" step="0.1" value="141.7">
        </div>

        <div class="control-group">
            <label for="slider-chaos">Perturbación Exógena (Ruido)</label>
            <input type="range" id="slider-chaos" min="0" max="1" step="0.01" value="0.2">
        </div>

        <div class="footer-info">
            Operador &Phi; | Métrica de Bures Activa &#x2705;
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE LA ESCENA 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- CREACIÓN DE LA GEOMETRÍA DE BURES / ARN ---
        const particleCount = 80;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const targetPositions = [];
        for (let i = 0; i < particleCount; i++) {
            const t = (i / particleCount) * Math.PI * 6;
            targetPositions.push(new THREE.Vector3(
                Math.cos(t) * 5,
                Math.sin(t) * 5,
                (i / particleCount) * 16 - 8
            ));
            
            positions[i * 3] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Material de partículas brillantes estilo ciberespacio cuántico
        const material = new THREE.PointsMaterial({
            size: 0.6,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Línea conectora del esqueleto
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.3 });
        const lineGeometry = new THREE.BufferGeometry();
        const lineMesh = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(lineMesh);

        // --- CONTROLES DE INTERACTIVIDAD ---
        let currentF0 = 141.7;
        let chaosLevel = 0.2;

        document.getElementById('slider-f0').addEventListener('input', (e) => {
            currentF0 = parseFloat(e.target.value);
            document.getElementById('val-f0').innerText = currentF0.toFixed(2) + " Hz";
        });

        document.getElementById('slider-chaos').addEventListener('input', (e) => {
            chaosLevel = parseFloat(e.target.value);
        });

        // --- BUCLE DE ANIMACIÓN Y EVOLUCIÓN DEL OPERADOR PHI ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            const posAttr = geometry.attributes.position;
            const colorAttr = geometry.attributes.color;
            const linePositions = [];

            for (let i = 0; i < particleCount; i++) {
                let px = posAttr.getX(i);
                let py = posAttr.getY(i);
                let pz = posAttr.getZ(i);

                let target = targetPositions[i];

                // Aplicación del operador Phi: Contracción hacia el atractor + filtro armónico de f0
                let harmonicFactor = Math.cos(time * (currentF0 / 50.0) + i * 0.1);
                let noiseX = (Math.random() - 0.5) * chaosLevel * harmonicFactor;
                let noiseY = (Math.random() - 0.5) * chaosLevel * harmonicFactor;

                // Dinámica de contracción de Banach (k = 1e-6 simulado en tasa de aproximación)
                px += (target.x - px) * 0.05 + noiseX;
                py += (target.y - py) * 0.05 + noiseY;
                pz += (target.z - pz) * 0.05;

                posAttr.setXYZ(i, px, py, pz);
                linePositions.push(px, py, pz);

                // Mapeo de color basado en la distancia de Bures (proximidad al atractor)
                let distToTarget = Math.sqrt(Math.pow(target.x - px, 2) + Math.pow(target.y - py, 2));
                let colorIntensity = Math.max(0, 1.0 - distToTarget / 5.0);
                
                colorAttr.setXYZ(i, 0.0, colorIntensity * 0.95 + 0.05, 1.0);
            }

            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;

            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

            // Rotación suave global de la escena simbiótica
            particleSystem.rotation.y = time * 0.2;
            lineMesh.rotation.y = time * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // --- RESPONSIVE WINDOW ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
