<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCAL Ecosystem - Visor .Qmol e Interfaz de Bures</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 25, 0.9);
            --accent: #00f2fe;
            --accent-secondary: #4facfe;
            --text-color: #e0e0e8;
            --border-glow: rgba(0, 242, 254, 0.3);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.1rem;
            margin-top: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }
        .metric-value {
            font-family: monospace;
            color: var(--accent-secondary);
        }
        .control-group {
            margin-top: 12px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: #b0b0c0;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #050508;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: opacity 0.2s;
        }
        .file-upload-btn:hover {
            opacity: 0.9;
        }
        .footer-info {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #808090;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>Visor QCAL .Qmol</h1>
        <div class="metric-row">
            <span>Protocolo:</span>
            <span class="metric-value" id="meta-protocol">QCAL-SYMBIO</span>
        </div>
        <div class="metric-row">
            <span>Frecuencia (f0):</span>
            <span class="metric-value" id="meta-f0">141.7001 Hz</span>
        </div>
        <div class="metric-row">
            <span>Coherencia (Ψ):</span>
            <span class="metric-value" id="meta-psi">0.999999</span>
        </div>
        <div class="metric-row">
            <span>Átomos Cargados:</span>
            <span class="metric-value" id="meta-count">60 (Simulados)</span>
        </div>

        <label for="qmol-file-input" class="file-upload-btn">📂 Cargar Archivo .Qmol</label>
        <input type="file" id="qmol-file-input" accept=".qmol,.txt">

        <div class="footer-info">
            Parser de Métrica de Bures Activo ✅
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SCENE 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        let particleSystem, lineMesh;
        let currentPositions = [];
        let buresValues = [];

        function createDefaultHelix() {
            const count = 60;
            const positions = [];
            const colors = [];
            buresValues = [];
            currentPositions = [];

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 6;
                const x = Math.cos(t) * 4;
                const y = Math.sin(t) * 4;
                const z = (i / count) * 14 - 7;
                
                currentPositions.push(new THREE.Vector3(x, y, z));
                buresValues.push(Math.random() * 1e-5);
            }
            updateSceneGeometry();
        }

        function updateSceneGeometry() {
            if (particleSystem) scene.remove(particleSystem);
            if (lineMesh) scene.remove(lineMesh);

            const count = currentPositions.length;
            const geom = new THREE.BufferGeometry();
            const posAttr = new Float32Array(count * 3);
            const colAttr = new Float32Array(count * 3);
            const linePos = [];

            for (let i = 0; i < count; i++) {
                const p = currentPositions[i];
                posAttr[i * 3] = p.x;
                posAttr[i * 3 + 1] = p.y;
                posAttr[i * 3 + 2] = p.z;
                
                linePos.push(p.x, p.y, p.z);

                // Gradiente color según Bures distance
                let intensity = Math.min(1.0, buresValues[i] * 1e6);
                colAttr[i * 3] = intensity;          // Canal R
                colAttr[i * 3 + 1] = 1.0 - intensity; // Canal G
                colAttr[i * 3 + 2] = 1.0;            // Canal B
            }

            geom.setAttribute('position', new THREE.BufferAttribute(posAttr, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));

            const mat = new THREE.PointsMaterial({ size: 0.7, vertexColors: true, transparent: true, opacity: 0.95 });
            particleSystem = new THREE.Points(geom, mat);
            scene.add(particleSystem);

            const lineGeom = new THREE.BufferGeometry().setFromPoints(currentPositions);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.4 });
            lineMesh = new THREE.Line(lineGeom, lineMat);
            scene.add(lineMesh);

            document.getElementById('meta-count').innerText = count;
        }

        // --- PARSER DEL ARCHIVO .QMOL ---
        document.getElementById('qmol-file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                parseQmolContent(content);
            };
            reader.readAsText(file);
        });

        function parseQmolContent(text) {
            const lines = text.split('\n');
            let newPositions = [];
            let newBures = [];
            let jsonMetaCaptured = false;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('{') || jsonMetaCaptured) {
                    try {
                        // Intento de captura de metadatos JSON
                        if (line.includes('fundamental_frequency_hz')) {
                            let match = line.match(/: \s*([0-9.]+)/);
                            if (match) document.getElementById('meta-f0').innerText = match[1] + " Hz";
                        }
                    } catch(err) {}
                    if (line.includes('}')) jsonMetaCaptured = true;
                }

                if (line.startsWith('ATOM')) {
                    const parts = line.split(/\s+/);
                    if (parts.length >= 10) {
                        const x = parseFloat(parts[6]);
                        const y = parseFloat(parts[7]);
                        const z = parseFloat(parts[8]);
                        const buresDb = parseFloat(parts[9]);

                        newPositions.push(new THREE.Vector3(x, y, z));
                        newBures.push(buresDb);
                    }
                }
            }

            if (newPositions.length > 0) {
                currentPositions = newPositions;
                buresValues = newBures;
                updateSceneGeometry();
                console.log(">> Archivo .qmol parseado e integrado con éxito.");
            } else {
                alert("Error: No se pudieron extraer registros ATOM válidos del archivo .qmol.");
            }
        }

        // Inicializar hélice por defecto
        createDefaultHelix();

        // --- BUCLE DE ANIMACIÓN ---
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            if (particleSystem) {
                particleSystem.rotation.y = time * 0.15;
                lineMesh.rotation.y = time * 0.15;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
